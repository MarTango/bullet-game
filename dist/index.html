<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Bullet Game</title>
  </head>
  <body>
    <div id="app">
      <div>
        <button id="reset" style="display: none">Reset</button>
        <p id="status">Host a new game, or join a friend's.</p>

        <div id="setup">
          <div id="choose">
            <button id="create-game">Host a game</button>
            <button id="join-game">Join a game</button>
          </div>

          <div id="host-flow" style="display: none">
            <p>1. Send this game code to your friend:</p>
            <textarea id="offer-out" rows="3" cols="60" readonly></textarea>
            <button id="copy-offer">Copy</button>
            <p>2. Paste the answer code they send back:</p>
            <textarea id="answer-in" rows="3" cols="60"></textarea>
            <button id="accept-answer">Connect</button>
          </div>

          <div id="guest-flow" style="display: none">
            <p>1. Paste the game code from the host:</p>
            <textarea id="offer-in" rows="3" cols="60"></textarea>
            <button id="create-answer">Create answer</button>
            <div id="answer-out-wrap" style="display: none">
              <p>2. Send this answer code back to the host:</p>
              <textarea id="answer-out" rows="3" cols="60" readonly></textarea>
              <button id="copy-answer">Copy</button>
            </div>
          </div>
        </div>

        <canvas height="640" width="640"></canvas>
      </div>
    </div>

    <style>
      canvas {
        background: #eee;
        display: block;
      }
      textarea {
        font-family: monospace;
        vertical-align: top;
      }
    </style>
  </body>
  <script src="//webrtc.github.io/adapter/adapter-latest.js"></script>
  <script src="bundle.js"></script>
</html>
